version: '3.8'

services:
  upload:
    build:
      context: ./Upload/backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./Upload/backend/.env
    environment:
      - PORT=3000
    restart: unless-stopped

  deploy:
    build:
      context: ./Deploy
      dockerfile: Dockerfile
    env_file:
      - ./Upload/backend/.env # Assuming same credentials
    restart: unless-stopped

  request:
    build:
      context: ./Request
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - ./Upload/backend/.env # Assuming same credentials
    environment:
      - PORT=3001
    restart: unless-stopped
